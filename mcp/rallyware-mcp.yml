server:
  name: rallyware
  transport: null
  url: null
  published: false

prerequisites:
  description: >-
    Anything built against this surface must solve three problems that Rallyware's
    current API design creates for agents.
  items:
  - id: per-tenant-host
    detail: >-
      There is no shared api.rallyware.com. The host is a required per-customer
      parameter (https://{tenant}.rallyware.com or a customer-branded domain), so any
      server must take the tenant host as configuration.
  - id: password-grant-only
    detail: >-
      The only published grants are OAuth2 resource-owner password credentials and
      refresh_token. An agent would have to hold end-user credentials — there is no
      client_credentials grant and no scoped, delegable token.
  - id: user-scoped-only
    detail: >-
      Every operation is scoped to the authenticated end user (/api/users/me,
      /api/me/tasks_models). There is no published tenant-admin or bulk surface.

tools:

