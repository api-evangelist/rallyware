apis:
- name: Rallyware Platform API
  description: >-
    The Rallyware tenant API — identity, task programs, tasks and task units, unit
    results, badges and KPIs for a customer's field organization. A JSON-LD / Hydra
    REST API on API Platform (Symfony), secured with OAuth2 bearer tokens issued at
    /oauth/v2/token. Rallyware publishes no developer portal, no API reference and no
    OpenAPI; this entry is profiled from Rallyware's own published React Native SDK,
    which contains the complete client implementation. Deployed one tenant per host,
    so the base URL is templated per customer and access is provisioned under an
    enterprise contract.
  humanURL: https://www.npmjs.com/package/@rallyware/sdk-react-native-components
  baseURL: https://{tenant}.rallyware.com
  baseURL_note: >-
    Templated and correct as written. Rallyware runs one deployment per customer on
    either a rallyware.com subdomain or a customer-branded domain; its own SDK
    requires the host as a caller-supplied argument. There is no shared
    api.rallyware.com. Resource paths sit under /api; the token endpoint is
    /oauth/v2/token.
  tags:
