aid: rallyware
name: Rallyware
description: >-
  Rallyware is an AI-powered sales performance and workforce enablement platform that guides
  distributed sellers, distributors, and field teams toward the next best action using real-time
  performance data, adaptive learning, gamification, and behavioral insights. It replaces fragmented
  enablement tools with a single orchestration system for large field and direct-selling organizations,
  and markets open APIs and pre-built connectors for CRM, POS, WFM, inventory, and HR systems. Rallyware
  runs a production REST API — JSON-LD/Hydra over API Platform, secured with OAuth2 — but does not
  publish it. There is no developer portal, no API reference and no OpenAPI, and the API is deployed one
  tenant per host and provisioned under an enterprise contract. The only public, machine-readable
  description of that API is Rallyware's own React Native SDK on npm, which ships the API client, its
  OAuth2 auth strategies, and an embeddable component library; the artifacts in this repository are
  derived from it.
