  detail: >-
    Rallyware publishes no developer portal, no API reference and no OpenAPI, and its
    API is deployed one tenant per host with no anonymously reachable instance — but
    the contract is not actually hidden: Rallyware's own React Native SDK on npm
    (@rallyware/sdk-react-native-components@1.2.1) ships the complete API client, so
    17 operations, the OAuth2 auth model, Hydra pagination conventions and 17 typed
    entities were recovered first-party rather than recorded as an absence.
