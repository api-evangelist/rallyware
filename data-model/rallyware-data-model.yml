source: >-
  npm @rallyware/sdk-react-native-components@1.2.1 —
  lib/typescript/dto/*.d.ts and lib/typescript/enums/*.d.ts
  (first-party TypeScript declarations published by Rallyware)
note: >-
  Entity-relationship graph of the Rallyware tenant API, derived from the typed DTOs
  Rallyware ships in its own SDK. Because Rallyware publishes no OpenAPI, these
  declarations are the authoritative public description of its resource shapes. Only
  the fields and relationships present in the published types are recorded; nothing
  is inferred. This graph covers the SDK-exposed slice of the platform (identity,
  task programs, tasks, task units, badges, KPIs) — Rallyware's admin, analytics and
  connector surfaces are not represented in the SDK and are therefore absent here.

id_conventions:
  primary_key: >-
    Integer `id` on every resource except Badge.category, which is keyed by `uuid`.
  external_key: >-
    User carries `external_id` — the identifier from the customer's own system of
    record (CRM/HRIS/distributor roster). It is the join key for enterprise
    integration and has its own lookup route, GET /users/external/{id}.
  iri_references: >-
    Relationships are expressed as API paths in request bodies (JSON-LD IRIs), e.g.
    user_task: "/api/user_tasks/{id}". See conventions/rallyware-conventions.yml.

entities:

- name: User
  dto: UserDto
  endpoints:
  - GET /api/users/me
  - "GET /users/external/{id}"
  - "GET /api/badges/{badgeId}/users"
  domain: identity
  fields:
    id: integer
    external_id: string
    identity: string
    first_name: string
    last_name: string
    full_name: string
    country_code: string
    state_code: string
    lang_code: string
    timezone: string|null
    avatar: string
    cover: string
    last_visit: string
    online: boolean
    approved: boolean
    is_activated: boolean
    is_email_verified: boolean
    rules_agreed_at: string
    expired_at: string|null
    scores: integer
    points: integer
    greeting_text: string
    track_id: string
    conversation_url: string|null
  relationships:
  - type: has_one
    target: UserLevel
    via: level
    nullable: true
  - type: has_many
    target: UserDataAttribute
    via: user_data_attributes

- name: UserProfile
  dto: UserProfileDto
  extends: User
  endpoints: [GET /api/users/me/profile]
  domain: identity
  fields:
    email: string
    is_rules_agreed: boolean
    assistant_icon: string
    use_profile_picture: boolean
    contact_card: object
    deletion_requested_at: string|null
  relationships:
  - type: has_many
    target: Kpi
    via: kpi
  note: >-
    The privileged projection of User for the authenticated principal. Carries the
    only PII fields in the model (email) and the GDPR erasure marker
    (deletion_requested_at).

- name: UserLevel
  dto: UserLevelDto
  domain: gamification
  fields: {id: integer, title: string, color: string}
  relationships:
  - type: belongs_to
    target: User
    via: level

- name: UserDataAttribute
  dto: UserDataAttributeDto
  domain: identity
  fields:
    name: string
    title: string
    type: string
    value: string|null
    is_public: boolean
    isPublic: boolean
  note: >-
    The tenant-extensible custom-attribute bag — how a customer projects its own
    distributor/employee fields onto the Rallyware user. Both snake_case `is_public`
    and camelCase `isPublic` are declared on the same type, an inconsistency carried
    in Rallyware's own published declarations.

- name: Kpi
  dto: KpiDto
  domain: performance
  fields: {value: string, type: string, icon: string, tooltip: string}
  relationships:
  - type: belongs_to
    target: UserProfile
    via: kpi
  note: Values are typed as string, not numeric — formatting is server-side.

- name: TaskProgram
  dto: TaskProgramDto
  endpoints:
