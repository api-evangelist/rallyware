- name: CombinedTask
  dto: CombinedTaskDto
  domain: enablement
  shape: >-
    Discriminated union — {type: 'Task', item: TaskDto} | {type: 'UserTask', item: UserTaskDto}
  endpoints: [GET /api/me/tasks_models]
  note: >-
    A polymorphic feed: /api/me/tasks_models returns unassigned catalogue Tasks and
    assigned UserTasks interleaved in one collection, discriminated by `type`.

- name: UnitConfig
  type_ref: types/unit-config.types
  endpoints:
  - "referenced as IRI /api/unit_configs/{id}"
  domain: enablement
  note: >-
    The configuration of one step ("unit") inside a task — the form/lesson definition
    the learner completes. Item types are enumerated by UnitReportItemTypesEnum.

- name: UnitResult
  dto: UnitResultOutputDto
  endpoints:
  - POST /api/unit_results/save_draft
  - PUT /api/unit_results/{id}/save_draft
  - POST /api/unit_results/submit
  - PUT /api/unit_results/{id}/submit
  domain: enablement
  fields:
    user_task: IRI string — /api/user_tasks/{id}
    unit_config: IRI string — /api/unit_configs/{id}
    data: UnitResultData
  relationships:
  - type: belongs_to
    target: UserTask
    via: user_task
  - type: belongs_to
    target: UnitConfig
    via: unit_config
  note: >-
    Carries a draft/submit split — the same payload is saved with save_draft and
    finalized with submit — and a review workflow via UnitResultStatusesEnum.

