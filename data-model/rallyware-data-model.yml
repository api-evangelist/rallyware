    created_at: string
    updated_at: string
  relationships:
  - type: has_one
    target: Task
    via: task
  - type: belongs_to
    target: TaskProgram
    via: task_program
  - type: has_many
    target: Tag
    via: full_tags
  - type: has_many
    target: UnitConfig
    via: unit_configs
    optional: true
  - type: has_many
    target: UnitResult
    via: unit_results
