  - "GET /api/task_programs/{id}"
  domain: enablement
  fields:
    id: integer
    title: string
    description: string
    cover: string
    bookmarked: boolean
    task_count: integer
    completed_task_count: integer
    completed_user_task_count: integer
    not_failed_user_task_count: integer
